<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
    h3 { color: #2E7D32; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #333; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: #fff; }
    input:focus { outline: none; border-color: #2E7D32; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #2E7D32; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1b5e20; }
    button:disabled { background: #aaa; cursor: default; }
    .error { color: #c62828; font-size: 13px; margin-top: 10px; display: none; }
    .spinner { display: none; text-align: center; margin-top: 12px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h3>🗑 <span data-i18n="pair.search.title"></span></h3>
  <p class="subtitle" data-i18n="pair.search.subtitle"></p>

  <label for="label" data-i18n="pair.search.name_label"></label>
  <input type="text" id="label" data-placeholder="pair.search.name_placeholder" />

  <label for="postcode" data-i18n="pair.search.postcode_label"></label>
  <input type="text" id="postcode" data-placeholder="pair.search.postcode_placeholder" maxlength="7" />

  <label for="huisnummer" data-i18n="pair.search.housenumber_label"></label>
  <input type="text" id="huisnummer" data-placeholder="pair.search.housenumber_placeholder" maxlength="10" />

  <label for="toevoeging" data-i18n="pair.search.toevoeging_label"></label>
  <input type="text" id="toevoeging" data-placeholder="pair.search.toevoeging_placeholder" maxlength="10" />

  <button id="nextBtn" data-i18n="pair.search.next_btn"></button>
  <div class="error" id="errorMsg"></div>
  <div class="spinner" id="spinner" data-i18n="pair.search.checking"></div>

  <script type="application/javascript">
    var homeyInstance = null;

    function initPair(Homey) {
      if (homeyInstance) return;
      homeyInstance = Homey;
      // data-i18n vult alleen tekst; placeholders zetten we zelf
      document.querySelectorAll('[data-placeholder]').forEach(function(el) {
        el.placeholder = Homey.__(el.getAttribute('data-placeholder'));
      });
      try { Homey.ready(); } catch(e) {}

      var btn      = document.getElementById('nextBtn');
      var errorEl  = document.getElementById('errorMsg');
      var spinner  = document.getElementById('spinner');

      btn.addEventListener('click', function() {
        var label      = document.getElementById('label').value;
        var postcode   = document.getElementById('postcode').value.trim();
        var huisnummer = document.getElementById('huisnummer').value.trim();
        var toevoeging = document.getElementById('toevoeging').value.trim();

        errorEl.style.display = 'none';

        if (!postcode || !huisnummer) {
          errorEl.textContent   = Homey.__('pair.search.error_required');
          errorEl.style.display = 'block';
          return;
        }

        btn.disabled          = true;
        spinner.style.display = 'block';

        Homey.emit('validate_address', { label: label, postcode: postcode, huisnummer: huisnummer, toevoeging: toevoeging })
          .then(function(result) {
            if (result && result.success) {
              Homey.showView('confirm');
            } else {
              errorEl.textContent   = (result && result.error) || Homey.__('errors.address_not_found');
              errorEl.style.display = 'block';
              btn.disabled          = false;
              spinner.style.display = 'none';
            }
          })
          .catch(function(err) {
            errorEl.textContent   = (err && err.message) || Homey.__('pair.search.error_unknown');
            errorEl.style.display = 'block';
            btn.disabled          = false;
            spinner.style.display = 'none';
          });
      });
    }

    function onHomeyReady(Homey) { initPair(Homey); }

    try { if (typeof Homey !== 'undefined') initPair(Homey); } catch(e) {}
    document.addEventListener('DOMContentLoaded', function() {
      try { if (typeof Homey !== 'undefined' && !homeyInstance) initPair(Homey); } catch(e) {}
    });
  </script>
</body>
</html>
