<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <g fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lid, seen from the right side, with a small front lip -->
    <path d="M170 290 L170 230 L740 230"/>
    <!-- Handle at the back of the lid -->
    <path d="M740 230 Q800 230 815 160"/>
    <!-- Body: front tapers towards the bottom, back edge stays straight above the wheel -->
    <path d="M210 230 L270 790 Q274 830 314 830 L560 830"/>
    <path d="M700 230 L700 660"/>
    <!-- Rim below the lid -->
    <path d="M222 340 L700 340"/>
    <!-- Wheel with axle at the bottom rear -->
    <circle cx="660" cy="760" r="90"/>
    <circle cx="660" cy="760" r="18"/>
  </g>
</svg>
